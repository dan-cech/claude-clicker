<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Claude Clicker</title>
</head>
<body>
    <button id="theme-toggle" title="Toggle theme">🌙</button>
    <div id="rain-container"></div>
    <div class="game-wrapper">
        <div class="left-panel">
            <h1>Claude Clicker</h1>
            <img id="btn-susenka" class="claude-img" src="images/claude.png" alt="CLAUDE">
            <h2>tokens: <span id="skore">0</span></h2>
            <p id="per-click">+1 per click</p>
        </div>

        <div class="shop-panel" id="shop-panel">
            <h3>Shop</h3>
            <button id="btn-upgrade-click">⚡ Buy More RAM — 25 tokens (+1/click)</button>
            <p class="upgrade-info" id="info-upgrade-click">Owned: 0 · +1/click</p>
            <button id="btn-babicka">Upgrade Servers — 10 tokens</button>
            <p class="upgrade-info" id="info-babicka">Owned: 0 · +0/s</p>
            <button id="btn-tovarna">Upgrade Data Centers — 50 tokens</button>
            <p class="upgrade-info" id="info-tovarna">Owned: 0 · +0/s</p>
        </div>
    </div>

    <div class="slot-machine" id="slot-machine">
        <h3>Slot Machine</h3>
        <div class="slot-reels">
            <div class="reel" id="reel-0">🍒</div>
            <div class="reel" id="reel-1">🍒</div>
            <div class="reel" id="reel-2">🍒</div>
        </div>
        <p class="slot-result" id="slot-result"></p>
        <div class="slot-controls">
            <button class="bet-btn" id="bet-down">−</button>
            <input type="number" id="bet-input" value="10" min="1">
            <button class="bet-btn" id="bet-up">+</button>
            <button id="spin-btn">Spin</button>
        </div>
        <p class="slot-odds">2 of a kind → 2x &nbsp;·&nbsp; 3 of a kind → 🍒8x 🍋15x 🍊30x 🍇75x 🍑200x</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
